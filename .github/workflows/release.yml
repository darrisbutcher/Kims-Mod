name: Release

on:
  # Pushing a version tag (for example v0.2.0) builds the mod and publishes a GitHub release with the jar.
  push:
    tags:
      - 'v*'
  # Running it by hand from the Actions tab builds the mod and keeps the jar as a workflow artifact,
  # but does not create a release. Use it to check that the build works.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Work out the version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(grep '^version=' gradle.properties | cut -d= -f2)-dev"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew build compileGametestJava -Pversion="$VERSION"

      - name: Keep the jar as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: securitycams-${{ steps.version.outputs.version }}
          path: build/libs/securitycams-${{ steps.version.outputs.version }}.jar
          if-no-files-found: error

      - name: Create the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          flags=""
          case "$VERSION" in
            *-*) flags="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" "build/libs/securitycams-$VERSION.jar" \
            --verify-tag \
            --title "Security Cameras $VERSION" \
            --generate-notes \
            $flags
